name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report a security problem here. Use the Security tab
        instead, see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: How are you running it
      options:
        - Desktop app (downloaded from releases)
        - From source, web mode (start.sh / start.ps1)
        - From source, development mode (dev.sh / dev.ps1)
        - Batch mode (batch.sh / batch.ps1)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The app version, or the commit you ran from source.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1 Apple Silicon, Windows 11, Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model
      placeholder: small
      description: Which transcription model was selected, if relevant.

  - type: textarea
    id: logs
    attributes:
      label: Output
      description: >
        Anything the terminal printed, or the error the app showed. Please
        redact file paths you would rather not publish.
      render: shell
